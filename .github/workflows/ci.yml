name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage (@clash/ui, gated ≥80%)
        run: pnpm test:coverage | tee coverage.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### @clash/ui coverage'
            echo '```'
            sed -n '/Coverage summary/,/====/p' coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @clash/web exec playwright install --with-deps chromium
      - name: E2E smoke tests
        run: pnpm --filter @clash/web test:e2e
